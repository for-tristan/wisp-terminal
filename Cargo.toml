[workspace]
resolver = "2"
members = [
    "crates/wisp-config",
    "crates/wisp-core",
    "crates/wisp-render",
    "crates/wisp-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/for-tristan/wisp-terminal"
description = "A high-performance, GPU-accelerated terminal emulator written in Rust"

[workspace.dependencies]
winit = "0.30"
wgpu = "24"
portable-pty = "0.8"
alacritty_terminal = "0.25"
font-kit = "0.14"
rusttype = { version = "0.9", features = ["gpu_cache"] }
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
dirs = "5"
clap = { version = "4.5", features = ["derive"] }

wisp-config = { path = "crates/wisp-config" }
wisp-core = { path = "crates/wisp-core" }
wisp-render = { path = "crates/wisp-render" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
