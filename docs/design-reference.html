<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Terminal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #172638;
            font-family: 'IBM Plex Mono', monospace;
            position: relative;
        }

        /* Atmospheric background */

        .background {
            position: fixed;
            inset: -50px;
            z-index: -2;
            background:
                radial-gradient(
                    ellipse at 12% 12%,
                    rgba(220, 231, 235, 0.9),
                    transparent 32%
                ),
                radial-gradient(
                    ellipse at 48% 8%,
                    rgba(108, 145, 164, 0.7),
                    transparent 40%
                ),
                radial-gradient(
                    ellipse at 90% 20%,
                    rgba(38, 66, 91, 0.9),
                    transparent 40%
                ),
                radial-gradient(
                    ellipse at 15% 75%,
                    rgba(118, 149, 163, 0.65),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #aabdc5 0%,
                    #49677e 48%,
                    #17263c 100%
                );
            filter: blur(35px);
            transform: scale(1.08);
        }

        /* Additional background atmosphere */

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    circle at 75% 70%,
                    rgba(126, 149, 172, 0.35),
                    transparent 18%
                ),
                radial-gradient(
                    circle at 28% 50%,
                    rgba(199, 214, 221, 0.3),
                    transparent 20%
                );
            filter: blur(40px);
        }

        /* Terminal container */

        .terminal {
            width: min(960px, calc(100% - 48px));
            min-height: 330px;
            padding: 60px 36px;

            background: rgba(34, 34, 34, 0.548);

            border: 2px solid rgba(173, 196, 215, 0.32);
            border-radius: 13px;

            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(185, 209, 229, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            position: relative;
            z-index: 1;
        }

        /* Terminal text */

        .terminal-content {
            color: #c4c9d2;
            font-size: clamp(14px, 2.15vw, 27px);
            line-height: 1.3;
            font-weight: 400;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .prompt {
            color: #c4cbd5;
        }

        .command {
            color: #d0d4dc;
        }

        .status {
            color: #91b2c9;
        }

        .message {
            color: #c4c9d2;
        }

        /* Blinking cursor */

        .cursor {
            display: inline-block;
            width: 17px;
            height: 32px;
            background: #e1e3e9;
            vertical-align: -5px;
            margin-left: 3px;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        /* Responsive layout */

        @media (max-width: 600px) {
            .terminal {
                width: calc(100% - 32px);
                min-height: 260px;
                padding: 45px 22px;
            }

            .terminal-content {
                font-size: 14px;
                line-height: 1.55;
            }

            .cursor {
                width: 10px;
                height: 19px;
                vertical-align: -3px;
            }
        }
    </style>
</head>

<body>


    <main class="terminal">
        <div class="terminal-content">

        </div>
    </main>

</body>
</html>
